[package]
name = "idempotency-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Idempotency keys for Rust — scoped key derivation, TTL claims with response replay, and pluggable memory/redis/sqlite stores"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/idempotency-kit"
keywords = ["idempotency", "deduplication", "redis", "webhook", "reliability"]
categories = ["asynchronous", "concurrency"]
exclude = [".github/", "benches/"]

[features]
default = ["memory"]
memory = ["dep:dashmap"]
redis = ["dep:redis"]

[dependencies]
async-trait = "0.1"
blake3 = { version = "1", default-features = false }
dashmap = { version = "6", default-features = false, optional = true }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
redis = { version = "0.27", default-features = false, features = [
  "tokio-comp",
  "connection-manager",
], optional = true }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
criterion = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["redis"] }

[[bench]]
name = "idempotency_bench"
harness = false

[[test]]
name = "redis_idempotency"
required-features = ["redis"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
